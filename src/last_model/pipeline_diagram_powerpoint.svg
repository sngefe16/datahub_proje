<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="960" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#0D47A1">
    Last Model - Fraud Detection Pipeline
  </text>
  <text x="960" y="85" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#666666" font-style="italic">
    Ensemble Model with Calibration &amp; Threshold Optimization
  </text>
  
  <!-- Step 1: Data Loading -->
  <rect x="100" y="120" width="300" height="70" rx="8" fill="#E3F2FD" stroke="#333" stroke-width="2"/>
  <text x="250" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">
    [1/11] Data Loading
  </text>
  <text x="250" y="175" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">
    Transaction + Identity Data
  </text>
  <path d="M 250 190 L 250 210" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Preprocessing -->
  <rect x="100" y="210" width="300" height="70" rx="8" fill="#BBDEFB" stroke="#333" stroke-width="2"/>
  <text x="250" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">
    [2/11] Preprocessing
  </text>
  <text x="250" y="265" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">
    Type Conversion, Missing Values
  </text>
  <path d="M 250 280 L 250 300" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Feature Engineering -->
  <rect x="100" y="300" width="300" height="70" rx="8" fill="#90CAF9" stroke="#333" stroke-width="2"/>
  <text x="250" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">
    [3/11] Feature Engineering
  </text>
  <text x="250" y="355" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">
    UID, Rolling Windows, Statistical
  </text>
  <path d="M 250 370 L 250 390" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Feature Preparation -->
  <rect x="100" y="390" width="300" height="70" rx="8" fill="#BBDEFB" stroke="#333" stroke-width="2"/>
  <text x="250" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">
    [4/11] Feature Preparation
  </text>
  <text x="250" y="445" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">
    Train/Val Split (80/20, Stratified)
  </text>
  <path d="M 250 460 L 250 480" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 5: SMOTE (Optional) -->
  <rect x="100" y="480" width="300" height="70" rx="8" fill="#BBDEFB" stroke="#333" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
  <text x="250" y="510" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">
    [5/11] SMOTE (Optional)
  </text>
  <text x="250" y="535" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">
    Class Imbalance Handling
  </text>
  <path d="M 250 550 L 250 570" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 6: Feature Selection -->
  <rect x="100" y="570" width="300" height="70" rx="8" fill="#90CAF9" stroke="#333" stroke-width="2"/>
  <text x="250" y="600" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">
    [6/11] Feature Selection
  </text>
  <text x="250" y="625" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">
    Variance, Correlation, Importance
  </text>
  <path d="M 250 640 L 250 660" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 7: Model Training -->
  <rect x="100" y="660" width="300" height="90" rx="8" fill="#64B5F6" stroke="#333" stroke-width="2"/>
  <text x="250" y="690" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">
    [7/11] Model Training
  </text>
  <text x="250" y="715" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">
    Ensemble: LGB + XGB + CatBoost
  </text>
  <text x="250" y="735" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">
    + Optuna Hyperparameter Tuning
  </text>
  <path d="M 250 750 L 250 770" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 8: Cross-Validation (Optional) -->
  <rect x="100" y="770" width="300" height="70" rx="8" fill="#42A5F5" stroke="#333" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
  <text x="250" y="800" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">
    [8/11] Cross-Validation (Optional)
  </text>
  <text x="250" y="825" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">
    3-Fold CV for Ensemble Weights
  </text>
  <path d="M 250 840 L 250 860" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 9: Model Evaluation -->
  <rect x="100" y="860" width="300" height="70" rx="8" fill="#42A5F5" stroke="#333" stroke-width="2"/>
  <text x="250" y="890" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">
    [9/11] Model Evaluation
  </text>
  <text x="250" y="915" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">
    AUC-ROC, Precision, Recall, F1
  </text>
  <path d="M 250 930 L 250 950" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 10: Calibration -->
  <rect x="100" y="950" width="300" height="70" rx="8" fill="#1E88E5" stroke="#333" stroke-width="2"/>
  <text x="250" y="980" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    [10/13] Probability Calibration
  </text>
  <text x="250" y="1005" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">
    Isotonic Regression
  </text>
  
  <!-- Right Column: Threshold Optimization Steps -->
  
  <!-- Step 10.5: Threshold Optimization -->
  <rect x="500" y="120" width="350" height="80" rx="8" fill="#0D47A1" stroke="#333" stroke-width="2"/>
  <text x="675" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    [10.5/13] Threshold Optimization
  </text>
  <text x="675" y="175" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">
    Multi-Objective
  </text>
  <text x="675" y="195" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">
    AUC≥0.94, Recall≥0.90, Precision≥0.40
  </text>
  <path d="M 675 200 L 675 220" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 10.6: Percentile Threshold Sweep -->
  <rect x="500" y="220" width="350" height="70" rx="8" fill="#0D47A1" stroke="#333" stroke-width="2"/>
  <text x="675" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    [10.6/13] Percentile Threshold Sweep
  </text>
  <text x="675" y="275" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">
    0.5% → 5% (Recall Target ≥0.90)
  </text>
  <path d="M 675 290 L 675 310" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 10.7: Cost-Based Threshold -->
  <rect x="500" y="310" width="350" height="70" rx="8" fill="#0D47A1" stroke="#333" stroke-width="2"/>
  <text x="675" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    [10.7/13] Cost-Based Threshold
  </text>
  <text x="675" y="365" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">
    FN/FP Ratios: 10x, 20x, 50x
  </text>
  <path d="M 675 380 L 675 400" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Final Threshold Selection -->
  <rect x="500" y="400" width="350" height="70" rx="8" fill="#0D47A1" stroke="#333" stroke-width="3"/>
  <text x="675" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    Final Threshold Selection
  </text>
  <text x="675" y="455" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">
    Priority: Percentile → Cost-Based → Multi-Objective
  </text>
  <path d="M 675 470 L 675 490" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 11: Test Predictions -->
  <rect x="500" y="490" width="350" height="70" rx="8" fill="#1565C0" stroke="#333" stroke-width="2"/>
  <text x="675" y="520" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    [11/11] Test Set Predictions
  </text>
  <text x="675" y="545" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">
    Submission File Generation
  </text>
  
  <!-- Connection from Step 10 to Threshold Optimization -->
  <path d="M 400 985 Q 450 985 500 160" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="950" y="120" width="900" height="400" rx="10" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
  <text x="1400" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    Pipeline Overview
  </text>
  
  <!-- Left column of legend -->
  <rect x="1000" y="180" width="25" height="20" fill="#E3F2FD" stroke="#333" stroke-width="1"/>
  <text x="1040" y="195" font-family="Arial, sans-serif" font-size="14" fill="#333">Data Processing</text>
  
  <rect x="1000" y="210" width="25" height="20" fill="#BBDEFB" stroke="#333" stroke-width="1"/>
  <text x="1040" y="225" font-family="Arial, sans-serif" font-size="14" fill="#333">Preprocessing</text>
  
  <rect x="1000" y="240" width="25" height="20" fill="#90CAF9" stroke="#333" stroke-width="1"/>
  <text x="1040" y="255" font-family="Arial, sans-serif" font-size="14" fill="#333">Feature Engineering</text>
  
  <rect x="1000" y="270" width="25" height="20" fill="#64B5F6" stroke="#333" stroke-width="1"/>
  <text x="1040" y="285" font-family="Arial, sans-serif" font-size="14" fill="#333">Model Training</text>
  
  <rect x="1000" y="300" width="25" height="20" fill="#42A5F5" stroke="#333" stroke-width="1"/>
  <text x="1040" y="315" font-family="Arial, sans-serif" font-size="14" fill="#333">Evaluation</text>
  
  <!-- Right column of legend -->
  <rect x="1400" y="180" width="25" height="20" fill="#1E88E5" stroke="#333" stroke-width="1"/>
  <text x="1440" y="195" font-family="Arial, sans-serif" font-size="14" fill="#333">Calibration</text>
  
  <rect x="1400" y="210" width="25" height="20" fill="#0D47A1" stroke="#333" stroke-width="1"/>
  <text x="1440" y="225" font-family="Arial, sans-serif" font-size="14" fill="#333">Threshold Optimization</text>
  
  <rect x="1400" y="240" width="25" height="20" fill="#1565C0" stroke="#333" stroke-width="1"/>
  <text x="1440" y="255" font-family="Arial, sans-serif" font-size="14" fill="#333">Output</text>
  
  <text x="1400" y="290" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666" font-style="italic">
    Dashed boxes indicate optional steps
  </text>
  
  <!-- Key Metrics Box -->
  <rect x="950" y="550" width="900" height="200" rx="10" fill="#e3f2fd" stroke="#0D47A1" stroke-width="2"/>
  <text x="1400" y="580" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0D47A1">
    Target Metrics
  </text>
  
  <text x="1100" y="620" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">AUC-ROC ≥ 0.94</text>
  <text x="1100" y="650" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Recall ≥ 0.90</text>
  <text x="1100" y="680" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Precision ≥ 0.40</text>
  
  <text x="1700" y="620" font-family="Arial, sans-serif" font-size="16" fill="#333">Ensemble: 3 Models</text>
  <text x="1700" y="650" font-family="Arial, sans-serif" font-size="16" fill="#333">Hyperparameter Tuning: Optuna</text>
  <text x="1700" y="680" font-family="Arial, sans-serif" font-size="16" fill="#333">Calibration: Isotonic Regression</text>
  
  <!-- Model Components Box -->
  <rect x="950" y="780" width="900" height="250" rx="10" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="1400" y="810" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    Model Components
  </text>
  
  <text x="1100" y="850" font-family="Arial, sans-serif" font-size="15" fill="#333">• LightGBM (Gradient Boosting)</text>
  <text x="1100" y="880" font-family="Arial, sans-serif" font-size="15" fill="#333">• XGBoost (Gradient Boosting)</text>
  <text x="1100" y="910" font-family="Arial, sans-serif" font-size="15" fill="#333">• CatBoost (Categorical Boosting)</text>
  <text x="1100" y="940" font-family="Arial, sans-serif" font-size="15" fill="#333">• Feature Selection (Variance, Correlation, Importance)</text>
  <text x="1100" y="970" font-family="Arial, sans-serif" font-size="15" fill="#333">• Threshold Optimization (3 Strategies)</text>
  <text x="1100" y="1000" font-family="Arial, sans-serif" font-size="15" fill="#333">• Probability Calibration (Isotonic Regression)</text>
  
  <text x="1700" y="850" font-family="Arial, sans-serif" font-size="15" fill="#333">• ~120 Selected Features</text>
  <text x="1700" y="880" font-family="Arial, sans-serif" font-size="15" fill="#333">• 3-Fold Cross-Validation</text>
  <text x="1700" y="910" font-family="Arial, sans-serif" font-size="15" fill="#333">• Early Stopping</text>
  <text x="1700" y="940" font-family="Arial, sans-serif" font-size="15" fill="#333">• Class Weighting</text>
  <text x="1700" y="970" font-family="Arial, sans-serif" font-size="15" fill="#333">• Time-Aware Validation</text>
</svg>

