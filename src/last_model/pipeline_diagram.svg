<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="2000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="2000" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#0D47A1">
    Last Model - Fraud Detection Pipeline
  </text>
  <text x="400" y="65" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666666" font-style="italic">
    Ensemble Model with Calibration &amp; Threshold Optimization
  </text>
  
  <!-- Step 1: Data Loading -->
  <rect x="50" y="100" width="700" height="60" rx="10" fill="#E3F2FD" stroke="#333" stroke-width="2"/>
  <text x="400" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    [1/11] Data Loading
  </text>
  <text x="400" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    Transaction + Identity Data
  </text>
  <path d="M 400 160 L 400 180" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Preprocessing -->
  <rect x="50" y="180" width="700" height="60" rx="10" fill="#BBDEFB" stroke="#333" stroke-width="2"/>
  <text x="400" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    [2/11] Preprocessing
  </text>
  <text x="400" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    Type Conversion, Missing Values
  </text>
  <path d="M 400 240 L 400 260" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Feature Engineering -->
  <rect x="50" y="260" width="700" height="60" rx="10" fill="#90CAF9" stroke="#333" stroke-width="2"/>
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    [3/11] Feature Engineering
  </text>
  <text x="400" y="305" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    UID, Rolling Windows, Statistical Features
  </text>
  <path d="M 400 320 L 400 340" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Feature Preparation -->
  <rect x="50" y="340" width="700" height="60" rx="10" fill="#BBDEFB" stroke="#333" stroke-width="2"/>
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    [4/11] Feature Preparation
  </text>
  <text x="400" y="385" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    Train/Val Split (80/20, Stratified)
  </text>
  <path d="M 400 400 L 400 420" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 5: SMOTE (Optional) -->
  <rect x="50" y="420" width="700" height="60" rx="10" fill="#BBDEFB" stroke="#333" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
  <text x="400" y="445" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    [5/11] SMOTE (Optional)
  </text>
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    Class Imbalance Handling
  </text>
  <path d="M 400 480 L 400 500" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 6: Feature Selection -->
  <rect x="50" y="500" width="700" height="60" rx="10" fill="#90CAF9" stroke="#333" stroke-width="2"/>
  <text x="400" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    [6/11] Feature Selection
  </text>
  <text x="400" y="545" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    Variance, Correlation, Importance
  </text>
  <path d="M 400 560 L 400 580" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 7: Model Training -->
  <rect x="50" y="580" width="700" height="80" rx="10" fill="#64B5F6" stroke="#333" stroke-width="2"/>
  <text x="400" y="605" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    [7/11] Model Training
  </text>
  <text x="400" y="625" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    Ensemble: LightGBM + XGBoost + CatBoost
  </text>
  <text x="400" y="645" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    + Optuna Hyperparameter Tuning
  </text>
  <path d="M 400 660 L 400 680" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 8: Cross-Validation (Optional) -->
  <rect x="50" y="680" width="700" height="60" rx="10" fill="#42A5F5" stroke="#333" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
  <text x="400" y="705" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    [8/11] Cross-Validation (Optional)
  </text>
  <text x="400" y="725" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    3-Fold CV for Ensemble Weights
  </text>
  <path d="M 400 740 L 400 760" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 9: Model Evaluation -->
  <rect x="50" y="760" width="700" height="60" rx="10" fill="#42A5F5" stroke="#333" stroke-width="2"/>
  <text x="400" y="785" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    [9/11] Model Evaluation
  </text>
  <text x="400" y="805" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    AUC-ROC, Precision, Recall, F1
  </text>
  <path d="M 400 820 L 400 840" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 10: Calibration -->
  <rect x="50" y="840" width="700" height="60" rx="10" fill="#1E88E5" stroke="#333" stroke-width="2"/>
  <text x="400" y="865" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    [10/13] Probability Calibration
  </text>
  <text x="400" y="885" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">
    Isotonic Regression (Ensemble Output)
  </text>
  <path d="M 400 900 L 400 920" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 10.5: Threshold Optimization -->
  <rect x="50" y="920" width="700" height="80" rx="10" fill="#0D47A1" stroke="#333" stroke-width="2"/>
  <text x="400" y="945" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    [10.5/13] Threshold Optimization
  </text>
  <text x="400" y="965" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">
    Multi-Objective: AUC≥0.94, Recall≥0.90, Precision≥0.40
  </text>
  <path d="M 400 1000 L 400 1020" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 10.6: Percentile Threshold Sweep -->
  <rect x="50" y="1020" width="700" height="60" rx="10" fill="#0D47A1" stroke="#333" stroke-width="2"/>
  <text x="400" y="1045" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    [10.6/13] Percentile Threshold Sweep
  </text>
  <text x="400" y="1065" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">
    0.5% → 5% (Recall Target ≥0.90)
  </text>
  <path d="M 400 1080 L 400 1100" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 10.7: Cost-Based Threshold -->
  <rect x="50" y="1100" width="700" height="60" rx="10" fill="#0D47A1" stroke="#333" stroke-width="2"/>
  <text x="400" y="1125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    [10.7/13] Cost-Based Threshold
  </text>
  <text x="400" y="1145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">
    FN/FP Ratios: 10x, 20x, 50x
  </text>
  <path d="M 400 1160 L 400 1180" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Final Threshold Selection -->
  <rect x="50" y="1180" width="700" height="60" rx="10" fill="#0D47A1" stroke="#333" stroke-width="3"/>
  <text x="400" y="1205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    Final Threshold Selection
  </text>
  <text x="400" y="1225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">
    Priority: Percentile → Cost-Based → Multi-Objective
  </text>
  <path d="M 400 1240 L 400 1260" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 11: Test Predictions -->
  <rect x="50" y="1260" width="700" height="60" rx="10" fill="#1565C0" stroke="#333" stroke-width="2"/>
  <text x="400" y="1285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    [11/11] Test Set Predictions
  </text>
  <text x="400" y="1305" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">
    Submission File Generation
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="1350" width="700" height="200" rx="10" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="1375" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    Legend
  </text>
  
  <rect x="80" y="1390" width="30" height="20" fill="#E3F2FD" stroke="#333" stroke-width="1"/>
  <text x="120" y="1405" font-family="Arial, sans-serif" font-size="12" fill="#333">Data Processing</text>
  
  <rect x="80" y="1420" width="30" height="20" fill="#BBDEFB" stroke="#333" stroke-width="1"/>
  <text x="120" y="1435" font-family="Arial, sans-serif" font-size="12" fill="#333">Preprocessing</text>
  
  <rect x="80" y="1450" width="30" height="20" fill="#90CAF9" stroke="#333" stroke-width="1"/>
  <text x="120" y="1465" font-family="Arial, sans-serif" font-size="12" fill="#333">Feature Engineering</text>
  
  <rect x="80" y="1480" width="30" height="20" fill="#64B5F6" stroke="#333" stroke-width="1"/>
  <text x="120" y="1495" font-family="Arial, sans-serif" font-size="12" fill="#333">Model Training</text>
  
  <rect x="400" y="1390" width="30" height="20" fill="#42A5F5" stroke="#333" stroke-width="1"/>
  <text x="440" y="1405" font-family="Arial, sans-serif" font-size="12" fill="#333">Evaluation</text>
  
  <rect x="400" y="1420" width="30" height="20" fill="#1E88E5" stroke="#333" stroke-width="1"/>
  <text x="440" y="1435" font-family="Arial, sans-serif" font-size="12" fill="#333">Calibration</text>
  
  <rect x="400" y="1450" width="30" height="20" fill="#0D47A1" stroke="#333" stroke-width="1"/>
  <text x="440" y="1465" font-family="Arial, sans-serif" font-size="12" fill="#333">Threshold Optimization</text>
  
  <rect x="400" y="1480" width="30" height="20" fill="#1565C0" stroke="#333" stroke-width="1"/>
  <text x="440" y="1495" font-family="Arial, sans-serif" font-size="12" fill="#333">Output</text>
  
  <text x="400" y="1520" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">
    Dashed boxes indicate optional steps
  </text>
</svg>

